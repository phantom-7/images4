        <dc:title
          >9 supreme shapes</dc:title
        >
        <dc:date
          >2011-04-29T20:34:23</dc:date
        >
        <dc:description
          >this is one of the coolest things yet. It almost competes with the chessboard in it's awesomeness. Each of the shapes I could go on forever about but it would be more important to describe how I did it.&#13;\n&#13;\nStarting with the top going clockwise, I made the 4 supreme regular polygons. They are the most well known polygons.&#13;\n&#13;\nThe next four shapes I'm unsure if they have a name, but they are created by the gaps between different numbers of circles. They may not be as well known as the regular polygons. Since they are curved instead of straight edged, they could be called polycurves.&#13;\n&#13;\nLast but certainly not least, the circle is in the center. It's not a polygon or a polycurve, but it's the most commonly occuring shape in the universe as far as I know. Also I had to include it since the polycurves were made from circle gaps.</dc:description
        >
